{% extends "taskapp/base.html" %}

{% block content %}
<h1>Tasks</h1>

<div id="task-list">
    {% include "taskapp/partials/task_list_body.html" %}
</div>

<div id="task-form-container">
    <button class="btn btn-primary"
            hx-get="{% url 'taskapp:task_create' %}"
            hx-target="#task-form-container"
            hx-swap="innerHTML">
        + New Task
    </button>
</div>
{% endblock %}
