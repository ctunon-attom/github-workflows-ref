<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task List{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        .task-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
        .task-row.completed .task-title { text-decoration: line-through; color: #888; }
        .task-title { flex: 1; }
        .task-desc { font-size: 0.85rem; color: #666; margin-top: 0.15rem; }
        .btn { padding: 0.3rem 0.7rem; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 0.8rem; }
        .btn:hover { background: #f5f5f5; }
        .btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { color: #dc2626; border-color: #dc2626; }
        .btn-danger:hover { background: #fef2f2; }
        .form-input, .form-textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 500; font-size: 0.9rem; }
        .actions { display: flex; gap: 0.5rem; }
        #task-list { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
