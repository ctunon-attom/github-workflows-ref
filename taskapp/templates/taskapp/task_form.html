{% extends "taskapp/base.html" %}

{% block title %}{{ action }} Task{% endblock %}

{% block content %}
<h1>{{ action }} Task</h1>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
        <p style="color: #dc2626; font-size: 0.85rem;">{{ error }}</p>
        {% endfor %}
    </div>
    {% endfor %}
    <div class="actions">
        <button type="submit" class="btn btn-primary">{{ action }}</button>
        <a href="{% url 'taskapp:task_list' %}" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}
