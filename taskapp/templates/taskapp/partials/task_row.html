<div class="task-row {% if task.completed %}completed{% endif %}" id="task-{{ task.pk }}">
    <form hx-post="{% url 'taskapp:task_toggle' task.pk %}" hx-target="#task-{{ task.pk }}" hx-swap="outerHTML">
        {% csrf_token %}
        <input type="checkbox" {% if task.completed %}checked{% endif %} onchange="this.form.requestSubmit()">
    </form>
    <div class="task-title">
        {{ task.title }}
        {% if task.description %}<div class="task-desc">{{ task.description }}</div>{% endif %}
    </div>
    <div class="actions">
        <button class="btn"
                hx-get="{% url 'taskapp:task_update' task.pk %}"
                hx-target="#task-{{ task.pk }}"
                hx-swap="outerHTML">Edit</button>
        <button class="btn btn-danger"
                hx-post="{% url 'taskapp:task_delete' task.pk %}"
                hx-target="#task-{{ task.pk }}"
                hx-swap="outerHTML"
                hx-confirm="Delete '{{ task.title }}'?">
            {% csrf_token %}
            Delete
        </button>
    </div>
</div>
