# Pre-commit hooks — mirror the CI lint job locally and catch secrets before they
# enter git history. Run once per clone:
#
#   pipenv run pre-commit install
#   pipenv run pre-commit install --hook-type pre-push
#
# Run against all files: pipenv run pre-commit run --all-files

repos:
  # Mirror CI lint job (.github/workflows/ci.yml).
  # Keep rev roughly in sync with the ruff version pinned in Pipfile.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(taskapp|config)/
      - id: ruff-format
        files: ^(taskapp|config)/

  # Secrets — the one check CI can't catch retroactively once in history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Standard hygiene — fast, zero-config, catch mistakes CI doesn't.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  # Pre-push: run tests whose source files differ from master. Scoped so it
  # stays under a few seconds on a feature branch; full suite still runs in CI.
  - repo: local
    hooks:
      - id: pytest-picked
        name: pytest (tests for files changed vs. master)
        entry: bash -c 'pipenv run pytest --picked --mode=branch --parent-branch=master || [ $? -eq 5 ]'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
